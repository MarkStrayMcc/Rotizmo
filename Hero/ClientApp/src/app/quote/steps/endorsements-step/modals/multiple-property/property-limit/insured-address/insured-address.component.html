<form [formGroup]="formGroup">
  <div class="form-group row">
    <div class="col-xs-12 col-md-2 md-mt1 text-right">
      <label>Client location</label>
    </div>

    <div class="col-xs-12 col-md-6">
      <select formControlName="clientLocationId">
        <option *ngFor="let insuredAddress of insuredAddresses$ | async" [value]="insuredAddress.clientLocationId">
          {{ insuredAddress.address1 + ', ' + insuredAddress.city }}
        </option>
      </select>
    </div>

    <div class="col-xs-12 col-md-3">
      <button id="client-location-new" class="btn-primary md-mr2" (click)="reset()">
        New Address
      </button>
    </div>
  </div>

  <div class="form-group row">
    <div class="col-xs-12 col-md-2 md-mt1 text-right">
      <label>Address line 1</label>
    </div>

    <div class="col-xs-12 col-md-4">
      <error [errorText]="{ required: 'Required', maxlength: 'Cannot be more than 100 characters long' }"
        [formCtrl]="formGroup.controls.address1">
        <input id="insured-address-address-line-1" class="form-control" formControlName="address1"
          [readonly]="isReadonly$ | async" />
      </error>
    </div>

    <div class="col-xs-12 col-md-2 md-mt1 text-right">
      <label>Address line 2</label>
    </div>

    <div class="col-xs-12 col-md-4  md-mt1">
      <error [errorText]="{ maxlength: 'Cannot be more than 100 characters long' }"
        [formCtrl]="formGroup.controls.address2">
        <input id="insured-address-address-line-2" class="form-control" formControlName="address2"
          [readonly]="isReadonly$ | async" />
      </error>
    </div>
  </div>

  <div class="form-group row">
    <div class="col-xs-12 col-md-2 md-mt1 text-right">
      <label>Address line 3</label>
    </div>

    <div class="col-xs-12 col-md-4">
      <error [errorText]="{ maxlength: 'Cannot be more than 100 characters long' }"
        [formCtrl]="formGroup.controls.address3">
        <input id="insured-address-address-line-3" class="form-control" formControlName="address3"
          [readonly]="isReadonly$ | async" />
      </error>
    </div>

    <div class="col-xs-12 col-md-2 md-mt1 text-right">
      <label>City</label>
    </div>

    <div class="col-xs-12 col-md-4">
      <error [errorText]="{ required: 'Required', maxlength: 'Cannot be more than 30 characters long' }"
        [formCtrl]="formGroup.controls.city">
        <input id="insured-address-city" class="form-control" formControlName="city" [readonly]="isReadonly$ | async" />
      </error>
    </div>
  </div>

  <div class="form-group row">
    <div class="col-xs-12 col-md-2 md-mt1 text-right">
      <label>County</label>
    </div>

    <div class="col-xs-12 col-md-4">
      <error [errorText]="{ required: 'Required', maxlength: 'Cannot be more than 100 characters long' }"
        [formCtrl]="formGroup.controls.county">
        <input id="insured-address-county" class="form-control" formControlName="county"
          [readonly]="isReadonly$ | async" />
      </error>
    </div>

    <ng-container *ngIf="isStateVisible$ | async">
      <div class="col-xs-12 col-md-2 md-mt1 text-right">
        <label>State</label>
      </div>

      <div class="col-xs-12 col-md-4">
        <input *ngIf="isReadonly$ | async" id="insured-address-state" class="form-control"
          [value]="stateControl.value?.text" readonly />
        <autocomplete-dropdown *ngIf="!(isReadonly$ | async)" id="insured-address-state" [dataSource]="states$"
          [myControl]="stateControl" (selected)="onStateSelected($event)">
        </autocomplete-dropdown>
      </div>
    </ng-container>
  </div>

  <div class="form-group row">
    <div class="col-xs-12 col-md-2 md-mt1 text-right">
      <label>Post code</label>
    </div>

    <div class="col-xs-12 col-md-4">
      <error [errorText]="{ required: 'Required' }" [formCtrl]="formGroup.controls.postcode">
        <input id="insured-address-post-code" class="form-control" formControlName="postcode"
          [readonly]="isReadonly$ | async" />
      </error>
    </div>

    <div class="col-xs-12 col-md-2 md-mt1 text-right">
      <label>Country</label>
    </div>

    <div class="col-xs-12 col-md-4">
      <input *ngIf="isReadonly$ | async" id="insured-address-country" class="form-control"
        [value]="countryControl.value?.text" readonly />
      <error *ngIf="!(isReadonly$ | async)" [errorText]="{ invalidOption: 'Required', required: 'Required' }"
        [formCtrl]="countryControl">
        <autocomplete-dropdown id="insured-address-country" [dataSource]="countries$" [myControl]="countryControl"
          (selected)="onCountrySelected($event)">
        </autocomplete-dropdown>
      </error>
    </div>
  </div>
</form>
