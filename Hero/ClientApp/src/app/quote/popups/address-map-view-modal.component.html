<div role="dialog">
    <div role="document">
        <div mat-dialog-title>
            <h1>View on map</h1>
            <div class="close" aria-label="Close" mat-dialog-close>&times;</div>
        </div>

        <div class="row md-mb3">
            <div class="col-md-5"><a id="viewMapBack" class="float-left btn-secondary" (click)="openClientAddressDialog()">SHOW MY ADDRESSES</a></div>

            <form method="post" id="geocoding_form">
                <div class="col-md-5 md-pr0">
                    <input id="searchText" name="searchText" type="text" [(ngModel)]="searchText" />
                </div>
                <div class="col-md-2 ">
                    <input id="btnMapSearch" type="submit" class="btn-primary" value="Search" (click)="onSearchLocation()" />
                </div>
            </form>
        </div>

        <div *ngIf="isLoaded" mat-dialog-content>
            <div class="popin">
                <div *ngIf="haveResult" id="map">
                    <agm-map id="agm-map" [latitude]="lat" [longitude]="lng" [zoom]="zoom">
                        <agm-marker
                            *ngFor="let m of markers;"
                            [latitude]="m.lat"
                            [longitude]="m.lng"
                            [markerDraggable]="m.draggable"
                            [iconUrl]="m.icon"></agm-marker>
                    </agm-map>
                </div>

                <div *ngIf="!haveResult" class="alert alert-warning">
                    Address not found
                </div>
            </div>
        </div>
    </div>
</div>
