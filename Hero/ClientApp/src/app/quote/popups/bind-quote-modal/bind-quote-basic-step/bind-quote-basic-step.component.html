<div [formGroup]="form" *ngIf="form" class="hide-invalid md-pt4">
    <div class="row md-p2">
        <div class="col-md-6">
            <h5>Inception date</h5>
        </div>
        <div class="col-md-6">
            <datepicker formControlName="inceptionDate"></datepicker>
            <div *ngIf="!form.controls.inceptionDate.valid && form.controls.inceptionDate.touched" class="help-block with-errors">
                <ul class="list-unstyled">
                    <li *ngIf="form.controls.inceptionDate.errors.required">
                        Required
                    </li>
                </ul>
            </div>
        </div>
    </div>

    <div class="row md-p2">
        <div class="col-md-6">
            <h5>Expiry date</h5>
        </div>
        <div class="col-md-6">
            <div [class.ng-invalid]="form.errors">
                <datepicker formControlName="expiryDate"></datepicker>
                <div *ngIf="!form.controls.expiryDate.valid && form.controls.expiryDate.touched" class="help-block with-errors">
                    <ul class="list-unstyled">
                        <li *ngIf="form.controls.expiryDate.errors.required">
                            Required
                        </li>
                    </ul>
                </div>
            </div>

            <div *ngIf="form.errors" class="help-block with-errors">
                <ul class="list-unstyled">
                    <li *ngIf="form.errors.expiryDateBeforeInceptionDate">
                        Expiry must be after inception
                    </li>
                </ul>
            </div>
        </div>
    </div>

    <div class="row md-p2">
        <div class="col-md-6">
            <h5>Received date</h5>
        </div>
        <div class="col-md-6">
            <datepicker formControlName="receivedDate"></datepicker>
            <div *ngIf="!form.controls.receivedDate.valid && form.controls.receivedDate.touched" class="help-block with-errors">
                <ul class="list-unstyled">
                    <li *ngIf="form.controls.receivedDate.errors.required">
                        Required
                    </li>
                    <li *ngIf="form.controls.receivedDate.errors.invalidDate">
                        Invalid Date
                    </li>
                    <li *ngIf="form.controls.receivedDate.errors.monthClosed">
                        This month has been closed. Please select another date
                    </li>
                </ul>
            </div>
        </div>
    </div>

    <div class="row md-p2" *ngIf="showSurplusLinesBroker">
        <div class="col-md-6">
            <h5>Surplus Lines Broker</h5>
        </div>
        <div class="col-md-6">
            <surplus-line-selector
                [formControl]="form.controls.surplusLinesBroker"
                [state]="state"
                [brokerTeamId]="quote.brokerTeam.id"
                [enableNewSurplusLines]="false">
            </surplus-line-selector>
        </div>
    </div>

    <div class="row md-p2" *ngIf="isLocalBrokerVisible">
        <div class="col-md-6">
            <h5 *ngIf="isCanadianBrokerVisible">Canadian Broker</h5>
            <h5 *ngIf="isEeaBrokerVisible">EEA Broker</h5>
        </div>
        <div class="col-md-6">
            <local-brokers formControlName="localBroker" [required]="true"></local-brokers>
        </div>
    </div>

    <div class="row md-p2" *ngIf="form">
        <risk-panel
            formControlName="riskQuestionAnswers"
            [quote]="quote"
            [riskQuestions]="riskQuestions"
            [isRiskStep]="false">
        </risk-panel>
    </div>

    <loading-spinner *ngIf="isLoading"></loading-spinner>
</div>
