<div *ngIf="isLoading">
    <app-loading></app-loading>
</div>

<div *ngIf="fileName && !isLoading" id="selected-file" class="tw-py-3 tw-flex tw-justify-between tw-items-center">
    <div class="tw-gap-1 tw-text-2xl">
        <span class="tw-font-medium">Uploaded : </span>
        <span id="file-name" class="tw-text-cfc-primary-blue tw-font-bold">{{fileName}}</span>
    </div>
    <button id="replace-file" (click)="replaceFile()"
        class="tw-bg-cfc-bright-blue tw-flex tw-justify-between tw-border-0 tw-items-center tw-rounded-lg tw-px-6 tw-py-4 tw-gap-3">
