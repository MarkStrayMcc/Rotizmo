<form [formGroup]="form" (ngSubmit)="save()" *ngIf="form">
    <div role="document" mat-dialog-title>
        <h1>New Surplus Lines Broker</h1>
        <div class="close" aria-label="Close" (click)="close()" *ngIf="!isSaving">&times;</div>
    </div>

    <div mat-dialog-content>
        <div class="row rowField">
            <div class="col-md-3">
                <label for="name">Name</label>
            </div>
            <div class="form-group">
                <div class="col-md-9">
                    <error [errorText]="{ required: 'Required', maxlength: 'Maximum of 150 characters' }" [formCtrl]="form.controls.name">
                        <input id="name" class="input-padding-fix" type="text" formControlName="name" />
                    </error>
                </div>
            </div>
        </div>

        <div class="row rowField">
            <div class="col-md-3">
                <label for="company">Company</label>
            </div>
            <div class="form-group">
                <div class="col-md-9">
                    <error [errorText]="{ required: 'Required', maxlength: 'Maximum of 150 characters' }" [formCtrl]="form.controls.company">
                        <input id="company" class="input-padding-fix hide-invalid" type="text" formControlName="company" />
                    </error>
                </div>
            </div>
        </div>

        <div *ngIf="isSurplusLinesLicenseFeatureEnabled" class="row rowField">
            <div class="col-md-3">
                <label for="licenceState">Licence State</label>
            </div>
            <div class="form-group">
                <div class="col-md-9">
                    <error [errorText]="{ required: 'Required', invalidOption: 'Invalid option' }" [formCtrl]="form.controls.licenceState">
                        <autocomplete-dropdown id="licenceState"
                            class="hide-invalid"
                            [dataSource]="usStates$"
                            formControlName="licenceState"
                            [myControl]="form.controls.licenceState">
                        </autocomplete-dropdown>
                    </error>
                </div>
            </div>
        </div>

        <div class="row rowField">
            <div class="col-md-3">
                <label for="licence">Licence No.</label>
            </div>
            <div class="form-group">
                <div class="col-md-9">
                    <error [errorText]="{ required: 'Required' }" [formCtrl]="form.controls.licence">
                        <input id="licence" class="input-padding-fix hide-invalid" type="text" formControlName="licence" />
                    </error>
                </div>
            </div>
        </div>

        <div class="row rowField">
            <div class="col-md-3">
                <label for="expiry">Expiry Date</label>
            </div>
            <div class="form-group">
                <div class="col-md-9">
                    <error [errorText]="{ required: 'Required' }" [formCtrl]="form.controls.expiry">
                        <datepicker id="expiry" class="maxWidth174px hide-invalid" formControlName="expiry"></datepicker>
                    </error>
                </div>
            </div>
        </div>

        <div class="row rowField">
            <div class="col-md-3">
                <label for="address1">Address</label>
            </div>
            <div class="form-group">
                <div class="col-md-9">
                    <error [errorText]="{ required: 'Required' }" [formCtrl]="form.controls.address1">
                        <input id="address1" class="input-padding-fix hide-invalid" type="text" formControlName="address1" />
                    </error>
                </div>
            </div>
        </div>

        <div class="row rowField" *ngIf="form.controls.address1.value">
            <div class="form-group">
                <div class=" col-md-offset-3 col-md-9">
                    <input id="address2" class="input-padding-fix" type="text" formControlName="address2" />
                </div>
            </div>
        </div>

        <div class="row rowField" *ngIf="form.controls.address2.value">
            <div class="form-group">
                <div class=" col-md-offset-3 col-md-9">
                    <input id="address3" class="input-padding-fix" type="text" formControlName="address3" />
                </div>
            </div>
        </div>

        <div class="row rowField">
            <div class="col-md-3">
                <label for="state">State</label>
            </div>
            <div class="col-md-9">
                <error [errorText]="{ required: 'Required', invalidOption: 'Invalid option' }" [formCtrl]="form.controls.state">
                    <autocomplete-dropdown id="state" class="hide-invalid" [dataSource]="usStates$"
                        formControlName="state" [myControl]="form.controls.state">
                    </autocomplete-dropdown>
                </error>
            </div>
        </div>

        <div class="row rowField">
            <div class="col-md-3">
                <label for="zip">Zip Code</label>
            </div>
            <div class="form-group">
                <div class="col-md-9">
                    <error [errorText]="{ required: 'Required' }" [formCtrl]="form.controls.zip">
                        <input id="zip" class="input-padding-fix hide-invalid" type="text" formControlName="zip" />
                    </error>
                </div>
            </div>
        </div>
    </div>

    <div mat-dialog-actions align="end">
        <button type="submit" class="btn-primary" [disabled]="disableSave">Save</button>
    </div>
</form>
