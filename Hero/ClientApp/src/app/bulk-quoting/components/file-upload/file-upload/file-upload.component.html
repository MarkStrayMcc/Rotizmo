<form [formGroup]="uploadBulkQuoteForm" (ngSubmit)="onSubmit()" #formDirective="ngForm">
  <div class="spacing-wrapper">
      <div *ngIf="displayErrorMessage">
          <div class="form-group">
              <message></message>
          </div>
      </div>

      <div class="form-group">
          <label for="brokerCompany"><strong>Broker Company</strong></label>
          <error [errorText]="{ invalidOption: 'Invalid Option', required: 'Required' }"
              [formCtrl]="uploadBulkQuoteForm.controls.brokerCompany">
              <autocomplete-dropdown formControlName="brokerCompany" name="brokerCompany" 
                  class="hide-invalid" [myControl]="uploadBulkQuoteForm.get('brokerCompany')"
                  [dataSource]="brokersObservable">
              </autocomplete-dropdown>

          </error>
      </div>

      <div class="form-group">

          <div class="form-group">
              <label for="bulkQuotesFile"><strong>File</strong></label>
              <input type="file" #fileUploader formControlName="bulkQuotesFile" name="bulkQuotesFile" (change)="onFileChange($event, 'bulkQuotesFile')"
                [attr.accept]="validFileTypes ? validFileTypes : null"  />
            </div>

      </div>

      <div class="form-group">
        <input class="input-checkbox"
                type="checkbox"
                id="emailQuoteSummaries"
                formControlName="emailQuoteSummaries"
                name="emailQuoteSummaries" />
        <label class="label-checkbox" for="emailQuoteSummaries" style="margin-top: 2px; margin-bottom: 2px; float: left; position: relative"></label>
        <label for="emailQuoteSummaries" style="margin: 6px 0 6px 6px;">
          <strong>Email Quote Summaries?</strong>
        </label>
      </div>

      <div class="form-group">
        <button type="submit" class="btn btn-primary" [disabled]="!uploadBulkQuoteForm.valid || isExecuting">Upload
          <mat-spinner *ngIf="isExecuting" strokeWidth="3" [diameter]="20"></mat-spinner>
        </button>   
      </div>

  </div>
</form>
