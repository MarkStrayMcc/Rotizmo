<div *ngIf="item">
    <ng-container *ngFor="let field of config.fields;let i = index;">
        <div *ngIf="i%2===0" class="form-group row">
            <ng-container *ngIf="field.isVisible">
                <div class="col-xs-12 col-md-2 md-mt1 text-right">
                    <label class="fieldname">{{field.label}}</label>
                </div>
                
                <div class="col-xs-12 col-md-4">
                    <app-form-field-renderer 
                        [config]="field" 
                        [formGroup]="form" 
                        [selectedItem]="getSelectedItem(field)"
                        [isVisible]="isVisible" 
                        [item]="item">
                    </app-form-field-renderer>
                </div>
            </ng-container>
            <ng-container *ngIf="config.fields[i+1] && config.fields[i+1].isVisible">
                <div class="col-xs-12 col-md-2 md-mt1 text-right xs-mt2">
                    <label class="fieldname">{{config.fields[i+1].label}}</label>
                </div>
                
                <div class="col-xs-12 col-md-4">
                    <app-form-field-renderer 
                        [config]="config.fields[i+1]" 
                        [formGroup]="form" 
                        [selectedItem]="getSelectedItem(config.fields[i+1])"
                        [isVisible]="isVisible" 
                        [item]="item">
                    </app-form-field-renderer>
                </div>
            </ng-container>
        </div>
        
    </ng-container>


    <ng-container *ngFor="let group of config.groups">
        <ng-container *ngFor="let field of group.fields;let i = index;">
            <div class="form-group row group" *ngIf="i%2===0" >
                <ng-container *ngIf="field.isVisible">
                    <div class="col-xs-12 col-md-2 md-mt1 text-right">
                        <label class="fieldname">{{field.label}}</label>
                    </div>
                    <div class="col-xs-12 col-md-4">
                        <app-form-field-renderer 
                            [config]="field" 
                            [formGroup]="form" 
                            [selectedItem]="getSelectedItem(field)"
                            [isVisible]="isVisible" 
                            [item]="item">
                        </app-form-field-renderer>
                    </div>
                </ng-container>
                <ng-container *ngIf="group.fields[i+1] && group.fields[i+1].isVisible">
                    <div class="col-xs-12 col-md-2 md-mt1 text-right xs-mt2">
                        <label class="fieldname">{{group.fields[i+1].label}}</label>
                    </div>
                    
                    <div class="col-xs-12 col-md-4">
                        <app-form-field-renderer 
                            [config]="group.fields[i+1]" 
                            [formGroup]="form" 
                            [selectedItem]="getSelectedItem(group.fields[i+1])"
                            [isVisible]="isVisible" 
                            [item]="item">
                        </app-form-field-renderer>
                    </div>
                </ng-container>
            </div>
        </ng-container>
        <hr *ngIf="group.hasSeparatorLine" />
    </ng-container>
</div>

<div class="form-group row">
    <div class="col-xs-12 col-md-4 md-mt1">
    </div>
    <div class="col-md-8 md-mt1">
        <ng-container *ngFor="let button of config.buttons">
            <button [type]="button.type" (click)="clicked(button)" [disabled]="isButtonDisabled(button)" class="btn btn-{{button.style}} float-right {{button?.cssClass}}">
                {{button.label}}
                <mat-spinner *ngIf="button.isExecuting" strokeWidth="3" [diameter]="20"></mat-spinner>
            </button>
        </ng-container>
    </div>
</div>
