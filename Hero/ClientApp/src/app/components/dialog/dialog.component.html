
<div mat-dialog-title>
    <h1>{{data.title}}</h1>
    <div class="close" aria-label="Close" mat-dialog-close>&times;</div>
</div>

<div mat-dialog-content>
    <p [innerHtml]="data.message"></p>
</div>

<div mat-dialog-actions class="pull-right">
    <button class="btn btn-link"
            mat-dialog-close
            *ngIf="isDismissiveActionVisible">
        {{data.dismissiveActionText ? data.dismissiveActionText : "Cancel"}}
    </button>
    <button class="btn btn-primary"
            [mat-dialog-close]="true"
            cdkFocusInitial>
        {{data.positiveActionText ? data.positiveActionText : "OK" }}
    </button>
</div>
