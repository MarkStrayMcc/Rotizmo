<mat-dialog-content>
    <div class="row">
        <div class="col-md-10">
            <h3 class="md-mt0">Would you like to transfer the selected records to the corresponding office account?</h3>
        </div>
    </div>
</mat-dialog-content>
<mat-dialog-actions align="end">
    <button type="button" class="btn btn-link" (click)="closeModal()">
        Cancel
    </button>
    <button type="button" class="btn btn-primary" [disabled]="isLoadingSpinnerVisible" (click)="onConfirm()">
        OK
        <mat-spinner *ngIf="isLoadingSpinnerVisible" strokeWidth="3" [diameter]="20"></mat-spinner>
    </button>
</mat-dialog-actions>
