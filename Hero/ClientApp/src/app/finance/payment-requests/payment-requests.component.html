<div class="container">
    <div class="row">
        <div class="col-md-12">
            <div class="col-md-9">
                <h1>Payment Requests</h1>
            </div>
        </div>
    </div>
    <div class="row" *ngIf="displayErrorMessage">
        <div class="form-group col-md-12">
            <message></message>
        </div>
    </div>
    <div class="row">
        <div class="col-md-12">
            <div class="form-group col-md-2">
                <label for="Status">Status</label>
                <dropdown-grid-filter-input #statusInput column="itemStatusId" (selectChanged)="onSelectedStatusChange($event)" [options]="statusOptions"></dropdown-grid-filter-input>
            </div>
            <div class="form-group col-md-2">
                <label for="ledgerReference">Ledger Reference</label>
                <text-grid-filter-input #ledgerRefInput column="ledgerReference"></text-grid-filter-input>
            </div>
            <div class="col-md-8 ">
                <button type="button" class="btn btn-primary pull-right" style="margin-bottom: 0px; margin-top: 25px;" (click)="clearGridFilters()">Reset Grid Filters</button>
            </div>
        </div>
    </div>
    <div class="row">
        <div class="col-md-12">
            <div>
                <ag-grid-angular #agGrid style="width: 100%; height: 700px;" class="ag-theme-bootstrap" [rowData]="paymentRequests"
                    [columnDefs]="paymentRequestsGridColumns" [defaultColDef]="defaultColumnDef" headerHeight="66"
                    [context]="context" [getRowNodeId]="getRowNodeId" [getBusinessKeyForNode]="getBusinessKeyForNode"
                    (rowDataChanged)="onRowDataChanged($event, scrollToDetails)" rowClass="ag-row-align" rowHeight="48"
                    rowMultiSelectWithClick="true" [enableSorting]="true" [enableFilter]="true" [enableColResize]="true"
                    [getRowStyle]="getRowStyle" rowSelection="multiple" [suppressRowClickSelection]="true"
                    [frameworkComponents]="frameworkComponents" [pinnedBottomRowData]="pinnedBottomRowData"
                    (selectionChanged)="setPinnedBottomRowData($event)" (gridReady)="onGridReady($event)">
                </ag-grid-angular>
            </div>
        </div>
    </div>
</div>
