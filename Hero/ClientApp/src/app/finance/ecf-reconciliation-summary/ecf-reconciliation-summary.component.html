<div [formGroup]="ecfReconciliationForm">
    <div class="row" *ngIf="displayErrorMessage">
        <div class="col-md-12">
            <message></message>
        </div>
    </div>
    <div class="row">
        <div class="form-group col-md-2">
            <label for="ucr">UCR</label>
            <error [errorText]="{ invalidOption: 'Invalid Option'}" [formCtrl]="ecfReconciliationForm.controls.ucr">
                <autocomplete-dropdown id="ucr"
                                       formControlName="ucr"
                                       *ngIf="ecfReconciliationForm"
                                       [customDisplayMethod]="ucrDisplay"
                                       [myControl]="ecfReconciliationForm.get('ucr')"
                                       [dataSource]="ucrLookups$"
                                       class="hide-invalid">
                </autocomplete-dropdown>
            </error>
        </div>
        <div class="form-group col-md-1">
            <label for="currencyId">Currency</label>
            <error [errorText]="{ invalidOption: 'Invalid Option', required: 'Required' }"
                   [formCtrl]="ecfReconciliationForm.controls.currencyId">
                <autocomplete-dropdown id="currencyId"
                                       formControlName="currencyId"
                                       *ngIf="ecfReconciliationForm"
                                       [customDisplayMethod] ="currencyDisplay"
                                       class="hide-invalid"
                                       [myControl]="ecfReconciliationForm.get('currencyId')"
                                       [dataSource]="currencyLookups$">
                </autocomplete-dropdown>
            </error>
        </div>
        <div class="form-group col-md-2">
            <error [errorText]="{ invalidOption: 'Invalid Option'}" [formCtrl]="ecfReconciliationForm.controls.unreconciledOnly">
                <input class="input-checkbox"
                       type="checkbox"
                       id="unreconciledOnly"
                       formControlName="unreconciledOnly"
                       name="unreconciledOnly" />
                <label class="label-checkbox" for="unreconciledOnly" style="margin-top: 28px; margin-bottom: 2px; float: left;"></label>
                <label for="unreconciledOnly" style="margin-top: 30px; margin-bottom: 0; margin-left: 10px">Unreconciled Only</label>
            </error>
        </div>
        <div class="form-group col-md-3">
            <div style="margin-top: 24px; margin-bottom: 6px;">
                <button type="button" class="btn btn-primary" (click)="openAddReconciliationDialog()">
                    Add ECF Reconciliation
                </button>
                <button type="button" class="btn btn-link" (click)="toggleFiltersVisibility()">{{ isShowFilters ? "Hide Filters" : "Show Filters"}}</button>
            </div>
        </div>
        <div class="col-md-4">
            <button type="button"
                    class="btn btn-primary pull-right"
                    style="margin-top: 24px; margin-bottom: 6px;"
                    (click)="clearFilters()"
                    *ngIf="!isShowFilters">Reset Grid Filters</button>
        </div>
    </div>
    <div class="row" *ngIf="isShowFilters">
        <div class="form-group col-md-2">
            <label for="ledgerReference">Ledger Reference</label>
            <error [errorText]="{ invalidOption: 'Invalid Option'}" [formCtrl]="ecfReconciliationForm.controls.financialLedgerId">
                <autocomplete-dropdown id="ledgerReference"
                                       formControlName="financialLedgerId"
                                       *ngIf="ecfReconciliationForm"
                                       [customDisplayMethod]="ledgerReferenceDisplay"
                                       [myControl]="ecfReconciliationForm.get('financialLedgerId')"
                                       [dataSource]="financialLedgerLookups$"
                                       class="hide-invalid">
                </autocomplete-dropdown>
            </error>
        </div>
        <div class="form-group col-md-2">
            <label for="binder">Binder</label>
            <error [errorText]="{ invalidOption: 'Invalid Option'}" [formCtrl]="ecfReconciliationForm.controls.binderId">
                <autocomplete-dropdown id="binder"
                                       formControlName="binderId"
                                       *ngIf="ecfReconciliationForm"
                                       [customDisplayMethod]="binderDisplay"
                                       [myControl]="ecfReconciliationForm.get('binderId')"
                                       [dataSource]="binderLookups$"
                                       class="hide-invalid">
                </autocomplete-dropdown>
            </error>
        </div>
        <div class="form-group col-md-1">
            <label for="binderSection">Binder Section</label>
            <error [errorText]="{ invalidOption: 'Invalid Option'}" [formCtrl]="ecfReconciliationForm.controls.sectionId">
                <autocomplete-dropdown id="binderSection"
                                       formControlName="sectionId"
                                       *ngIf="ecfReconciliationForm"
                                       [customDisplayMethod]="binderSectionDisplay"
                                       [myControl]="ecfReconciliationForm.get('sectionId')"
                                       [dataSource]="binderSectionLookups$"
                                       class="hide-invalid">
                </autocomplete-dropdown>
            </error>
        </div>
        <div class="form-group col-md-1">
            <label for="riskCode">Risk Code</label>
            <error [errorText]="{  invalidOption: 'Invalid Option' }" [formCtrl]="ecfReconciliationForm.controls.riskCode">
                <autocomplete-dropdown id="riskCode"
                                       formControlName="riskCode"
                                       *ngIf="ecfReconciliationForm"
                                       [myControl]="ecfReconciliationForm.get('riskCode')"
                                       [dataSource]="riskCodeLookups$"
                                       class="hide-invalid">
                </autocomplete-dropdown>
            </error>
        </div>
        <div class="col-md-1">
            <button type="button" id="fetchButton" class="btn btn-primary pull-right" style="margin-top: 24px; margin-bottom: 6px;" (click)="fetchEcfs()">
                Fetch
            </button>
        </div>
        <div class="col-md-5">
            <button type="button" class="btn btn-primary pull-right" style="margin-top: 24px; margin-bottom: 6px;" (click)="clearFilters()">Reset Grid Filters</button>
        </div>
    </div>
    <div class="row">
        <div class="col-md-12">
            <ag-grid-angular #agGrid
                             style="width: 100%; height: 590px;"
                             class="ag-theme-bootstrap"
                             headerHeight="66"
                             rowHeight="48"
                             rowClass="ag-row-align"
                             [getRowStyle]="getRowStyle"
                             [enableSorting]="true"
                             [enableFilter]="true"
                             [enableColResize]="true"
                             rowMultiSelectWithClick="true"
                             rowSelection="multiple"
                             [suppressRowClickSelection]="true"
                             [rowData]="ecfReconciliationSummary"
                             [columnDefs]="ecfReconciliationSummaryGridColumns"
                             [defaultColDef]="defaultColumnDef"
                             [frameworkComponents]="frameworkComponents"
                             (gridReady)="onGridReady($event)"
                             (selectionChanged)="setPinnedBottomRowData()"
                             (filterModified)="setPinnedBottomRowData()">
            </ag-grid-angular>
            <div style="position: absolute; bottom: 2px; right: 10px;">
                <button type="button"
                        id="reconcileButton"
                        class="btn btn-primary"
                        style="margin-top: 6px; margin-bottom: 6px;"
                        *ngIf="canReconcile"
                        (click)="onReconcile()">
                    Reconcile
                </button>
                <button type="button"
                        id="unreconcileButton"
                        class="btn btn-primary pull-right"
                        style="margin-top: 6px; margin-bottom: 6px;"
                        *ngIf="canUnreconcile"
                        (click)="onUnreconcile()">
                    Unreconcile
                </button>
            </div>
        </div>
    </div>
</div>
