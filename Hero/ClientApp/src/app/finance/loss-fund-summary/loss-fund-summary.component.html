<div class="container">
    <div class="row">
        <div class="col-md-12">
            <div class="col-md-9">
                <h1>Loss Fund Summary</h1>
            </div>
            <div class="col-md-3 ">
                <button type="button" class="btn btn-primary pull-right" style="margin-top: 10px; margin-bottom: 30px;" (click)="clearFilters()">Reset Grid Filters</button>
            </div>
        </div>
    </div>
    <div class="row">
        <div class="col-md-12">
            <div>
                <ag-grid-angular #agGrid style="width: 100%; height: 790px;" class="ag-theme-bootstrap" [rowData]="lossFundSummaries" [columnDefs]="lossFundSummaryGridColumns"
                                 [defaultColDef]="defaultColumnDef" headerHeight="66" rowClass="ag-row-align" rowHeight="48" [enableSorting]="true" [getRowStyle]="getRowStyle"
                                 [enableFilter]="true" [enableColResize]="true">
                </ag-grid-angular>
            </div>
        </div>
    </div>
</div>
