<form #changeBulkStatusForm [formGroup]="statusForm" (ngSubmit)="onSubmit()">
    <div mat-dialog-title>
        <h1 class="d-flex">
            <span>Bulk Update</span>
            <h2>&nbsp;-&nbsp;{{displayMessage}}</h2>
        </h1>
        <div class="close" aria-label="Close" mat-dialog-close>&times;</div>
    </div>

    <mat-dialog-content>
        <div class="row" *ngIf="displayErrorMessage">
            <div class="form-group col-md-12">
                <message></message>
            </div>
        </div>
        <div class="row" *ngIf="failedSaveCount==0">
            <div class="form-group col-md-6">
                <label for="status">Status</label>
                <error [errorText]="{ required: 'Required' }"
                       [formCtrl]="statusForm.controls.status">
                    <select class="form-control" id="status" formControlName="status"
                            name="status" #status>
                        <option *ngFor="let status of statusOptions" [value]="status.value">
                            {{ status.text }}
                        </option>
                    </select>
                </error>
            </div>
            <div class="form-group col-md-6 hide-invalid" *ngIf="paidFormGroup()" [formGroup]="paidFormGroup()">
                <label for="paidDate">Paid Date</label>
                <error *ngIf="paidFormGroup().controls.paidDate"
                       [errorText]="{ invalidDate: 'Invalid Date', required: 'Required' }"
                       [formCtrl]="paidFormGroup().controls.paidDate">
                    <datepicker *ngIf="paidFormGroup()" #paidDate formControlName="paidDate"></datepicker>
                </error>
            </div>
        </div>
        <div class="row" *ngIf="failedSaveCount==0">
            <div class="form-group col-md-12">
                <label for="notes">Notes</label>
                <textarea draggable="true" class="form-control" id="notes" formControlName="notes"
                          name="notes" #notes>
                    </textarea>
            </div>
        </div>
    </mat-dialog-content>

    <mat-dialog-actions align="end">
        <ng-container *ngIf="failedSaveCount === 0; else close">
            <button type="button" class="btn btn-link" (click)="onCloseModal()">Cancel</button>
            <button type="submit" class="btn btn-primary" [disabled]="!statusForm.valid || !statusForm.dirty || queryInProgress">OK</button>
        </ng-container>

        <ng-template #close>
            <button type="button" class="btn btn-secondary" (click)="onCloseModal()">Close</button>
        </ng-template>
    </mat-dialog-actions>
</form>
